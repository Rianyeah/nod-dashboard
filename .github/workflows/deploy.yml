name: Verify and publish dashboard image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked backend test dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Test and audit backend
        working-directory: backend
        run: |
          python -m pytest tests -q
          python -m pip_audit -r requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test, audit, and build frontend
        working-directory: frontend
        run: |
          npm ci
          node --test src/__tests__/*.test.js
          npm run lint
          npm audit --omit=dev --audit-level=high
          npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nod-dashboard" >> "$GITHUB_OUTPUT"

      - name: Validate public Mapbox build token
        shell: bash
        env:
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
        run: |
          if [[ -z "$VITE_MAPBOX_TOKEN" ]]; then
            echo "ERROR: VITE_MAPBOX_TOKEN is missing. Configure GitHub Actions repository variable VITE_MAPBOX_TOKEN." >&2
            exit 1
          fi
          if [[ "$VITE_MAPBOX_TOKEN" != pk.* ]]; then
            echo "ERROR: VITE_MAPBOX_TOKEN must be a public token starting with pk. Configure GitHub Actions repository variable VITE_MAPBOX_TOKEN." >&2
            exit 1
          fi

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_MAPBOX_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
